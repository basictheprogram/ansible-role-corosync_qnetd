---
# Whether to enable and start the corosync-qnetd service after the package
# is installed. Set to false to manage service state externally — for
# example, if certificate trust setup must happen before the daemon
# first starts.
corosync_qnetd_enable_service: true

# Additional OS packages to install alongside corosync-qnetd.
corosync_qnetd_extra_packages: []

# IP address corosync-qnetd listens on. Empty (default) means listen on
# the wildcard address. Site-specific binding addresses belong in
# group_vars/host_vars, not in this role's defaults.
corosync_qnetd_listen_address: ""

# TCP port corosync-qnetd listens on.
corosync_qnetd_listen_port: 5403

# Which IP address family to listen on: "any", "ipv4", or "ipv6".
corosync_qnetd_address_family: "any"

# TLS mode for client (corosync-qdevice) connections: "on", "off", or
# "required". Defaults to "on" — Proxmox VE's own documentation
# requires QDevice-to-cluster traffic to be encrypted, and this is
# also upstream's own default. "on" and "required" require the
# daemon's own NSS certificate database to exist
# (corosync-qnetd-certutil -i); corosync_qnetd_manage_nss_db defaults
# to true so this role creates that database automatically. Only set
# this to "off" if you understand the security tradeoff — see the
# warning in README.md and DESIGN.md.
corosync_qnetd_tls: "on"

# Whether to initialize the daemon's own NSS certificate database
# (corosync-qnetd-certutil -i) when corosync_qnetd_tls is not "off".
# Defaults to true so corosync_qnetd_tls's "on" default works
# out of the box on every supported platform. Idempotent: skipped
# once /etc/corosync/qnetd/nssdb/qnetd-cacert.crt exists. Does not
# touch per-cluster trust (corosync-qdevice-net-certutil), which
# stays a manual, multi-host step performed from each client cluster
# — see README.md and DESIGN.md.
corosync_qnetd_manage_nss_db: true

# Whether clients must present a TLS client certificate. Only takes
# effect when corosync_qnetd_tls is not "off".
corosync_qnetd_client_cert_required: true

# Maximum simultaneous client connections. 0 means no limit.
corosync_qnetd_max_clients: 0

# Turn on debug-level logging.
corosync_qnetd_debug: false
